<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab Game Hub</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 500px;
    }
    h1 {
      text-align: center;
      color: #38bdf8;
      font-size: 1.6rem;
      margin-bottom: 16px;
    }
    .card {
      background: #1e293b;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid #334155;
    }
    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 6px 0;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 15px;
    }
    button.broadcast-btn {
      background: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 10px;
    }
    button.clear-btn {
      background: #ef4444;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 6px;
      padding: 8px;
      font-size: 13px;
    }
    .feed-item {
      background: #1e293b;
      border-left: 4px solid #38bdf8;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .game-name {
      font-weight: bold;
      color: #fbbf24;
      font-size: 1.15rem;
      margin-bottom: 6px;
    }
    .row-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .code-box {
      background: #0f172a;
      padding: 6px 12px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 1.05rem;
      color: #4ade80;
      display: inline-block;
      border: 1px solid #334155;
    }
    .link-text {
      color: #38bdf8;
      word-break: break-all;
      text-decoration: underline;
      font-size: 0.9rem;
      max-width: 320px;
    }
    .copy-pill {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.8rem;
      cursor: pointer;
      width: auto;
      margin: 0;
      transition: background 0.2s;
    }
    .copy-pill:active {
      background: #22c55e;
      color: #0f172a;
    }
    .time {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Lab Hub 🎮</h1>

    <div class="card">
      <h3 style="margin-top:0;">Broadcast Room / Code</h3>
      <input type="text" id="game" placeholder="Game Name (e.g. BGMI, Skribbl)">
      <input type="text" id="code" placeholder="Room Code / Match ID">
      <input type="url" id="link" placeholder="Direct Link (optional)">
      <button class="broadcast-btn" onclick="postUpdate()">Broadcast to Systems</button>
      <button class="clear-btn" onclick="clearAllGames()">Clear Feed Now</button>
    </div>

    <h3>Active Games</h3>
    <div id="feed">Waiting for updates...</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyALuuDDM5SeC5_Ff5FNg1FofYfm06BxdY0",
      authDomain: "lab-hub-318a2.firebaseapp.com",
      databaseURL: "https://lab-hub-318a2-default-rtdb.firebaseio.com",
      projectId: "lab-hub-318a2",
      storageBucket: "lab-hub-318a2.firebasestorage.app",
      messagingSenderId: "648359872715",
      appId: "1:648359872715:web:3e9c545aa35d623ed8334e",
      measurementId: "G-83NNL4613F"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const gamesRef = ref(db, 'lab-games');

    // Automatically remove after 10 minutes (600,000 milliseconds)
    const EXPIRY_TIME_MS = 10 * 60 * 1000;

    window.copyText = function(text, btnElement) {
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btnElement.innerText;
        btnElement.innerText = "Copied! ✓";
        btnElement.style.background = "#22c55e";
        btnElement.style.color = "#0f172a";
        setTimeout(() => {
          btnElement.innerText = originalText;
          btnElement.style.background = "#334155";
          btnElement.style.color = "#f8fafc";
        }, 1500);
      });
    };

    window.postUpdate = function() {
      const game = document.getElementById("game").value.trim();
      const code = document.getElementById("code").value.trim();
      const link = document.getElementById("link").value.trim();

      if (!game && !code && !link) {
        alert("Enter at least a name or code!");
        return;
      }

      push(gamesRef, {
        game: game || "Game",
        code: code || "",
        link: link || "",
        timeString: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        createdAt: Date.now()
      });

      document.getElementById("game").value = "";
      document.getElementById("code").value = "";
      document.getElementById("link").value = "";
    };

    window.clearAllGames = function() {
      if (confirm("Clear all active games for everyone?")) {
        remove(gamesRef);
      }
    };

    onValue(gamesRef, (snapshot) => {
      const feed = document.getElementById("feed");
      feed.innerHTML = "";
      const data = snapshot.val();

      if (!data) {
        feed.innerHTML = "<p style='color:#64748b;'>No active games right now.</p>";
        return;
      }

      const now = Date.now();
      const entries = Object.entries(data).reverse();
      let activeCount = 0;

      entries.forEach(([key, item]) => {
        // Auto-delete from Firebase if older than 10 minutes
        if (item.createdAt && (now - item.createdAt > EXPIRY_TIME_MS)) {
          remove(ref(db, `lab-games/${key}`));
          return;
        }

        activeCount++;
        const div = document.createElement("div");
        div.className = "feed-item";

        let html = `<div class="game-name">${item.game}</div>`;

        if (item.code) {
          html += `
            <div class="row-group">
              <span class="code-box">${item.code}</span>
              <button class="copy-pill" onclick="copyText('${item.code}', this)">Copy Code</button>
            </div>
          `;
        }

        if (item.link) {
          html += `
            <div class="row-group">
              <a class="link-text" href="${item.link}" target="_blank">Open Link</a>
              <button class="copy-pill" onclick="copyText('${item.link}', this)">Copy Link</button>
            </div>
          `;
        }

        html += `<div class="time">Sent at ${item.timeString || "Just now"}</div>`;

        div.innerHTML = html;
        feed.appendChild(div);
      });

      if (activeCount === 0) {
        feed.innerHTML = "<p style='color:#64748b;'>No active games right now.</p>";
      }
    });
  </script>
</body>
</html>
