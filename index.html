<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GAME HUB | Naughty Kansari Limited</title>
  <!-- PeerJS WebRTC Audio Engine -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --cyber-blue: #38bdf8;
      --cyber-neon: #06b6d4;
      --cyber-green: #22c55e;
      --cyber-red: #ef4444;
      --cyber-purple: #c084fc;
      --glass-bg: rgba(10, 15, 29, 0.78);
      --glass-card: rgba(17, 24, 39, 0.72);
      --glass-border: rgba(56, 189, 248, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: 
        linear-gradient(180deg, rgba(3, 7, 18, 0.88) 0%, rgba(10, 15, 29, 0.82) 50%, rgba(3, 7, 18, 0.94) 100%),
        url("https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=2070&auto=format&fit=crop");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #f8fafc;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 540px;
    }

    .status-bar {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(74, 222, 128, 0.35);
      border-radius: 999px;
      font-size: 0.75rem;
      font-family: monospace;
      letter-spacing: 0.08em;
      color: var(--cyber-green);
      margin-bottom: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 14px rgba(34, 197, 94, 0.2);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background: var(--cyber-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--cyber-green);
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .header-box {
      text-align: center;
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand-logo {
      width: 90px;
      height: 70px;
      margin-bottom: 8px;
      filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.6));
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { 
        transform: translateY(0px); 
        filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.55));
      }
      50% { 
        transform: translateY(-5px); 
        filter: drop-shadow(0 0 26px rgba(6, 182, 212, 0.85));
      }
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 35px rgba(56, 189, 248, 0.4);
    }

    .sub-brand {
      font-size: 0.82rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-top: 6px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .sub-brand::before, .sub-brand::after {
      content: "";
      width: 28px;
      height: 1px;
      background: rgba(148, 163, 184, 0.4);
    }

    /* Tab Switcher */
    .tab-container {
      display: flex;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 18px;
      gap: 6px;
      backdrop-filter: blur(12px);
    }

    .tab-btn {
      flex: 1;
      padding: 10px 14px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(129, 140, 248, 0.25));
      color: var(--cyber-blue);
      border: 1px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
    }

    .card {
      background: var(--glass-card);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      padding: 22px;
      border-radius: 16px;
      margin-bottom: 24px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.55);
    }

    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      margin: 7px 0;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: rgba(10, 15, 29, 0.85);
      color: #f8fafc;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    textarea {
      font-family: 'SF Mono', Monaco, Consolas, 'Courier New', monospace;
      font-size: 0.85rem;
      min-height: 120px;
      resize: vertical;
      line-height: 1.45;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--cyber-blue);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
      background: rgba(15, 23, 42, 0.95);
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.2s ease;
    }

    button.broadcast-btn {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #030712;
      padding: 12px;
      font-size: 15px;
      letter-spacing: 0.04em;
      box-shadow: 0 4px 18px rgba(56, 189, 248, 0.38);
    }

    button.broadcast-btn:hover {
      box-shadow: 0 0 22px rgba(56, 189, 248, 0.65);
      transform: translateY(-1px);
    }

    button.clear-btn {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.45);
      color: #fca5a5;
      padding: 12px 16px;
      font-size: 13px;
      letter-spacing: 0.03em;
    }

    button.clear-btn:hover {
      background: var(--cyber-red);
      color: #ffffff;
    }

    .section-title {
      font-size: 0.95rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
    }

    .feed-item {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-left: 4px solid var(--cyber-neon);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding: 14px 16px;
      border-radius: 12px;
      margin-bottom: 14px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
      animation: slideIn 0.3s ease-out;
    }

    .feed-item.solution-card {
      border-left-color: var(--cyber-purple);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .game-name {
      font-weight: 800;
      color: #fde047;
      font-size: 1.15rem;
      letter-spacing: 0.04em;
    }

    .lang-badge {
      background: rgba(192, 132, 252, 0.18);
      border: 1px solid rgba(192, 132, 252, 0.4);
      color: #e9d5ff;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-family: monospace;
      font-weight: bold;
    }

    .countdown-tag {
      font-family: monospace;
      font-size: 0.75rem;
      color: var(--cyber-neon);
      background: rgba(6, 182, 212, 0.12);
      border: 1px solid rgba(6, 182, 212, 0.3);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .row-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .code-box {
      background: rgba(2, 6, 23, 0.85);
      padding: 6px 14px;
      border-radius: 8px;
      font-family: 'SF Mono', Monaco, Consolas, monospace;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--cyber-green);
      border: 1px solid rgba(34, 197, 94, 0.35);
      letter-spacing: 0.06em;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.18);
    }

    .code-snippet-box {
      background: #090d16;
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 8px;
      position: relative;
    }

    .code-snippet-box pre {
      font-family: 'SF Mono', Monaco, Consolas, monospace;
      font-size: 0.82rem;
      color: #a7f3d0;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 220px;
      overflow-y: auto;
      margin: 0;
    }

    .code-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .link-text {
      color: var(--cyber-blue);
      word-break: break-all;
      text-decoration: underline;
      font-size: 0.9rem;
      max-width: 300px;
    }

    .copy-pill {
      background: rgba(51, 65, 85, 0.85);
      color: #f8fafc;
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .copy-pill:active {
      background: var(--cyber-green);
      color: #020617;
      transform: scale(0.96);
    }

    .time {
      font-size: 0.72rem;
      color: #64748b;
      margin-top: 10px;
      font-family: monospace;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* RIGHT FAB (CHAT BOT) */
    .chatbot-fab {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      z-index: 9999;
      transition: transform 0.2s ease;
      user-select: none;
    }

    .chatbot-fab:hover {
      transform: scale(1.08);
    }

    .chatbot-fab-btn {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid var(--cyber-blue);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.5), inset 0 0 10px rgba(6, 182, 212, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
    }

    .chatbot-fab-label {
      margin-top: 6px;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #38bdf8;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 2px 8px;
      border-radius: 8px;
      box-shadow: 0 0 8px rgba(0,0,0,0.5);
    }

    /* LEFT FAB (CHAT ROOM) */
    .room-fab {
      position: fixed;
      bottom: 24px;
      left: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      z-index: 9999;
      transition: transform 0.2s ease;
      user-select: none;
    }

    .room-fab:hover {
      transform: scale(1.08);
    }

    .room-fab-btn {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid var(--cyber-neon);
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.5), inset 0 0 10px rgba(56, 189, 248, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
    }

    .room-fab-label {
      margin-top: 6px;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--cyber-neon);
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(6, 182, 212, 0.3);
      padding: 2px 8px;
      border-radius: 8px;
      box-shadow: 0 0 8px rgba(0,0,0,0.5);
    }

    /* RIGHT MODAL (AI CHAT BOT) */
    .chat-modal {
      position: fixed;
      bottom: 106px;
      right: 24px;
      width: 360px;
      max-width: calc(100vw - 40px);
      height: 480px;
      background: rgba(10, 15, 29, 0.94);
      border: 1px solid var(--cyber-blue);
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(56, 189, 248, 0.25);
      backdrop-filter: blur(20px);
      display: none;
      flex-direction: column;
      z-index: 9999;
      overflow: hidden;
      animation: popUp 0.25s ease-out;
    }

    .chat-modal.open {
      display: flex;
    }

    /* LEFT MODAL (CYBER CHAT ROOM) */
    .room-modal {
      position: fixed;
      bottom: 106px;
      left: 24px;
      width: 390px;
      max-width: calc(100vw - 40px);
      height: 540px;
      background: rgba(10, 15, 29, 0.96);
      border: 1px solid var(--cyber-neon);
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(6, 182, 212, 0.25);
      backdrop-filter: blur(20px);
      display: none;
      flex-direction: column;
      z-index: 9999;
      overflow: hidden;
      animation: popUp 0.25s ease-out;
    }

    .room-modal.open {
      display: flex;
    }

    @keyframes popUp {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .chat-header, .room-header {
      padding: 12px 14px;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(56, 189, 248, 0.25);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-close-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
    }

    .chat-close-btn:hover {
      color: #f8fafc;
      background: rgba(239, 68, 68, 0.3);
    }

    .chat-messages {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.85rem;
    }

    .chat-msg {
      max-width: 85%;
      padding: 8px 12px;
      border-radius: 10px;
      line-height: 1.4;
      word-break: break-word;
    }

    .chat-msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }

    .chat-msg.bot {
      align-self: flex-start;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: #e2e8f0;
      border-bottom-left-radius: 2px;
    }

    .chat-msg pre {
      background: #020617;
      padding: 8px;
      border-radius: 6px;
      margin-top: 6px;
      margin-bottom: 6px;
      overflow-x: auto;
      font-family: monospace;
      font-size: 0.78rem;
      color: #a7f3d0;
      border: 1px solid rgba(56, 189, 248, 0.2);
      white-space: pre-wrap;
    }

    .chat-input-area {
      padding: 10px 12px;
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid rgba(56, 189, 248, 0.25);
      display: flex;
      gap: 8px;
    }

    .chat-input-area input {
      margin: 0;
      padding: 8px 10px;
      font-size: 0.85rem;
    }

    .chat-input-area button {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #020617;
      padding: 8px 14px;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    /* GATE SCREEN (AVATAR & CODENAME PICKER BEFORE ENTERING) */
    .avatar-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 12px 0;
    }

    .avatar-opt {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      border: 2px solid rgba(148, 163, 184, 0.25);
      background: rgba(15, 23, 42, 0.8);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      transition: all 0.2s ease;
      margin: 0 auto;
    }

    .avatar-opt:hover {
      border-color: var(--cyber-neon);
      transform: translateY(-2px);
    }

    .avatar-opt.selected {
      border-color: var(--cyber-neon);
      background: rgba(6, 182, 212, 0.2);
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.5);
    }

    /* CHAT ROOM INTERNAL TABS (TEXT CHAT vs VOICE CHAT) */
    .room-subtabs {
      display: flex;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid rgba(6, 182, 212, 0.25);
      padding: 4px 8px;
      gap: 6px;
    }

    .room-tab-btn {
      flex: 1;
      padding: 8px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .room-tab-btn.active {
      background: rgba(6, 182, 212, 0.25);
      color: var(--cyber-neon);
      border: 1px solid rgba(6, 182, 212, 0.4);
    }

    /* CYBER TEXT CHAT FEED */
    .room-text-feed {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg-bubble-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      max-width: 90%;
    }

    .msg-bubble-group.self {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg-author-header {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--cyber-blue);
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 5px;
      letter-spacing: 0.04em;
    }

    .msg-bubble-group.self .msg-author-header {
      color: var(--cyber-neon);
    }

    .msg-bubble-content {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 10px;
      padding: 8px 12px;
      color: #f8fafc;
      font-size: 0.85rem;
      line-height: 1.35;
      word-break: break-word;
      border-top-left-radius: 2px;
    }

    .msg-bubble-group.self .msg-bubble-content {
      background: linear-gradient(135deg, rgba(2, 132, 199, 0.5), rgba(6, 182, 212, 0.4));
      border-color: rgba(6, 182, 212, 0.45);
      border-top-left-radius: 10px;
      border-top-right-radius: 2px;
    }

    .msg-timestamp {
      font-size: 0.65rem;
      color: #64748b;
      font-family: monospace;
      margin-left: 6px;
      font-weight: normal;
    }

    /* VOICE TAB LAYOUT */
    .voice-members-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 14px;
      overflow-y: auto;
      flex: 1;
    }

    .voice-member-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 12px;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      position: relative;
    }

    .voice-avatar-icon {
      font-size: 2.2rem;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: rgba(3, 7, 18, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid transparent;
      transition: all 0.2s ease;
    }

    /* GOOGLE MEET SPEAKING GLOW */
    .voice-member-card.speaking .voice-avatar-icon {
      border-color: var(--cyber-green);
      box-shadow: 0 0 22px var(--cyber-green);
      tr
