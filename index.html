<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GAME HUB | Naughty Kansari Limited</title>
  <style>
    :root {
      --cyber-blue: #38bdf8;
      --cyber-neon: #06b6d4;
      --cyber-green: #22c55e;
      --cyber-red: #ef4444;
      --cyber-purple: #c084fc;
      --glass-card: rgba(17, 24, 39, 0.75);
      --glass-border: rgba(56, 189, 248, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: 
        linear-gradient(180deg, rgba(3, 7, 18, 0.88) 0%, rgba(10, 15, 29, 0.82) 50%, rgba(3, 7, 18, 0.94) 100%),
        url("https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=2070&auto=format&fit=crop");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #f8fafc;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 540px;
    }

    .status-bar {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(74, 222, 128, 0.35);
      border-radius: 999px;
      font-size: 0.75rem;
      font-family: monospace;
      letter-spacing: 0.08em;
      color: var(--cyber-green);
      margin-bottom: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 14px rgba(34, 197, 94, 0.2);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background: var(--cyber-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--cyber-green);
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .header-box {
      text-align: center;
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand-logo-wrap {
      width: 84px;
      height: 84px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      animation: cyberFloat 3.5s ease-in-out infinite;
    }

    .brand-logo-wrap svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 14px rgba(6, 182, 212, 0.65));
    }

    @keyframes cyberFloat {
      0%, 100% {
        transform: translateY(0px);
        filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.5));
      }
      50% {
        transform: translateY(-6px);
        filter: drop-shadow(0 0 26px rgba(6, 182, 212, 0.9));
      }
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 35px rgba(56, 189, 248, 0.4);
    }

    .sub-brand {
      font-size: 0.82rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-top: 6px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .sub-brand::before, .sub-brand::after {
      content: "";
      width: 28px;
      height: 1px;
      background: rgba(148, 163, 184, 0.4);
    }

    .tab-container {
      display: flex;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 18px;
      gap: 6px;
      backdrop-filter: blur(12px);
    }

    .tab-btn {
      flex: 1;
      padding: 11px 14px;
      border: 1px solid transparent;
      background: transparent;
      color: #94a3b8;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .tab-btn.active {
      background: rgba(56, 189, 248, 0.18);
      color: var(--cyber-blue);
      border-color: rgba(56, 189, 248, 0.4);
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.25);
    }

    .card {
      background: var(--glass-card);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      padding: 22px;
      border-radius: 16px;
      margin-bottom: 24px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.55);
    }

    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      margin: 7px 0;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: rgba(10, 15, 29, 0.85);
      color: #f8fafc;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    textarea {
      font-family: 'SF Mono', Monaco, Consolas, monospace;
      font-size: 0.85rem;
      min-height: 120px;
      resize: vertical;
      line-height: 1.45;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--cyber-blue);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
      background: rgba(15, 23, 42, 0.95);
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.2s ease;
    }

    button.broadcast-btn {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #030712;
      padding: 12px;
      font-size: 15px;
      letter-spacing: 0.04em;
      box-shadow: 0 4px 18px rgba(56, 189, 248, 0.38);
    }

    button.broadcast-btn:hover {
      box-shadow: 0 0 22px rgba(56, 189, 248, 0.65);
      transform: translateY(-1px);
    }

    button.clear-btn {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.45);
      color: #fca5a5;
      padding: 12px 16px;
      font-size: 13px;
      letter-spacing: 0.03em;
    }

    button.clear-btn:hover {
      background: var(--cyber-red);
      color: #ffffff;
    }

    .section-title {
      font-size: 0.95rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
    }

    .feed-item {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-left: 4px solid var(--cyber-neon);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding: 14px 16px;
      border-radius: 12px;
      margin-bottom: 14px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
      animation: slideIn 0.3s ease-out;
    }

    .feed-item.solution-card {
      border-left-color: var(--cyber-purple);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .game-name {
      font-weight: 800;
      color: #fde047;
      font-size: 1.15rem;
      letter-spacing: 0.04em;
    }

    .lang-badge {
      background: rgba(192, 132, 252, 0.18);
      border: 1px solid rgba(192, 132, 252, 0.4);
      color: #e9d5ff;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-family: monospace;
      font-weight: bold;
    }

    .countdown-tag {
      font-family: monospace;
      font-size: 0.75rem;
      color: var(--cyber-neon);
      background: rgba(6, 182, 212, 0.12);
      border: 1px solid rgba(6, 182, 212, 0.3);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .row-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .code-box {
      background: rgba(2, 6, 23, 0.85);
      padding: 6px 14px;
      border-radius: 8px;
      font-family: 'SF Mono', Monaco, Consolas, monospace;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--cyber-green);
      border: 1px solid rgba(34, 197, 94, 0.35);
      letter-spacing: 0.06em;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.18);
    }

    .code-snippet-box {
      background: #090d16;
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 8px;
    }

    .code-snippet-box pre {
      font-family: 'SF Mono', Monaco, Consolas, monospace;
      font-size: 0.82rem;
      color: #a7f3d0;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 220px;
      overflow-y: auto;
      margin: 0;
    }

    .code-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .link-text {
      color: var(--cyber-blue);
      word-break: break-all;
      text-decoration: underline;
      font-size: 0.9rem;
      max-width: 300px;
    }

    .copy-pill {
      background: rgba(51, 65, 85, 0.85);
      color: #f8fafc;
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .copy-pill:active {
      background: var(--cyber-green);
      color: #020617;
      transform: scale(0.96);
    }

    .time {
      font-size: 0.72rem;
      color: #64748b;
      margin-top: 10px;
      font-family: monospace;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }
  </style>

  <!-- Reliable Global Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="container">
    <div class="header-box">
      <div class="status-bar">
        <span class="pulse-dot"></span>
        <span>NETWORK: ONLINE</span>
      </div>
      
      <div class="brand-logo-wrap">
        <svg viewBox="0 0 160 140" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="cyberNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#38bdf8"/>
              <stop offset="50%" stop-color="#06b6d4"/>
              <stop offset="100%" stop-color="#0284c7"/>
            </linearGradient>
          </defs>
          <path d="M 22 70 L 36 50 M 22 70 L 36 90" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
          <path d="M 138 70 L 124 50 M 138 70 L 124 90" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
          <text x="80" y="24" font-family="monospace" font-size="12" font-weight="900" fill="#22d3ee" text-anchor="middle">&lt;/&gt;</text>
          <path d="M 48 34 L 48 106 M 48 34 L 80 106 M 80 34 L 80 106" stroke="url(#cyberNodeGrad)" stroke-width="6.5" stroke-linecap="round"/>
          <path d="M 80 70 L 112 34 M 80 70 L 112 106" stroke="url(#cyberNodeGrad)" stroke-width="6.5" stroke-linecap="round"/>
          <path d="M 48 34 L 112 34 M 48 106 L 112 106" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2.5" stroke-dasharray="3,3"/>
          <circle cx="48" cy="34" r="6" fill="#38bdf8"/>
          <circle cx="48" cy="106" r="6" fill="#06b6d4"/>
          <circle cx="80" cy="34" r="6" fill="#e0f2fe"/>
          <circle cx="80" cy="106" r="6" fill="#0284c7"/>
          <circle cx="112" cy="34" r="6" fill="#38bdf8"/>
          <circle cx="112" cy="106" r="6" fill="#06b6d4"/>
        </svg>
      </div>

      <h1>GAME HUB</h1>
      <div class="sub-brand">By Naughty Kansari Limited</div>
    </div>

    <!-- Navigation Tabs -->
    <div class="tab-container">
      <button class="tab-btn active" id="tab-btn-games" onclick="switchActiveTab('games')">🎮 Game Lobbies</button>
      <button class="tab-btn" id="tab-btn-codes" onclick="switchActiveTab('codes')">💻 Lab Solutions</button>
    </div>

    <!-- TAB 1: GAME HUB -->
    <div id="game-tab" class="tab-content active">
      <div class="card">
        <h3 style="margin-bottom: 8px; font-size: 1rem; color: #cbd5e1;">Broadcast Lobby</h3>
        <input type="text" id="game" placeholder="Game Name (e.g. BGMI, Skribbl)">
        <input type="text" id="code" placeholder="Room Code / Match Key">
        <input type="url" id="link" placeholder="Direct Link (optional)">
        
        <div class="btn-grid">
          <button class="broadcast-btn" onclick="postGameUpdate()">Broadcast</button>
          <button class="clear-btn" onclick="clearFeed('games')">Clear Feed</button>
        </div>
      </div>

      <div class="section-title">
        <span>Active Broadcast</span>
      </div>
      <div id="feed">Connecting to network...</div>
    </div>

    <!-- TAB 2: CODING SOLUTIONS -->
    <div id="code-tab" class="tab-content">
      <div class="card">
        <h3 style="margin-bottom: 8px; font-size: 1rem; color: #cbd5e1;">Broadcast Code Solution</h3>
        <select id="code-lang">
          <option value="C/C++">C / C++</option>
          <option value="Java">Java</option>
          <option value="Python">Python</option>
          <option value="Web (HTML/JS)">Web (HTML/JS)</option>
          <option value="SQL">SQL</option>
          <option value="Other">Other</option>
        </select>
        <input type="text" id="code-title" placeholder="Problem / Title (e.g. Binary Search, Lab Task 3)">
        <textarea id="code-body" placeholder="// Paste complete working code solution here..."></textarea>
        
        <div class="btn-grid">
          <button class="broadcast-btn" onclick="postCodeSolution()">Transmit Solution</button>
          <button class="clear-btn" onclick="clearFeed('solutions')">Clear Feed</button>
        </div>
      </div>

      <div class="section-title">
        <span>Active Lab Solutions</span>
      </div>
      <div id="code-feed">Connecting to network...</div>
    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyALuuDDM5SeC5_Ff5FNg1FofYfm06BxdY0",
      authDomain: "lab-hub-318a2.firebaseapp.com",
      databaseURL: "https://lab-hub-318a2-default-rtdb.firebaseio.com",
      projectId: "lab-hub-318a2",
      storageBucket: "lab-hub-318a2.firebasestorage.app",
      messagingSenderId: "648359872715",
      appId: "1:648359872715:web:3e9c545aa35d623ed8334e",
      measurementId: "G-83NNL4613F"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const gamesRef = db.ref('lab-games');
    const solutionsRef = db.ref('lab-solutions');

    const EXPIRY_TIME_MS = 5 * 60 * 1000;

    window.switchActiveTab = function(type) {
      const tabGamesBtn = document.getElementById("tab-btn-games");
      const tabCodesBtn = document.getElementById("tab-btn-codes");
      const gameTab = document.getElementById("game-tab");
      const codeTab = document.getElementById("code-tab");

      if (type === 'games') {
        tabGamesBtn.classList.add("active");
        tabCodesBtn.classList.remove("active");
        gameTab.classList.add("active");
        codeTab.classList.remove("active");
      } else {
        tabCodesBtn.classList.add("active");
        tabGamesBtn.classList.remove("active");
        codeTab.classList.add("active");
        gameTab.classList.remove("active");
      }
    };

    window.triggerCopy = function(text, btnElement) {
      navigator.clipboard.writeText(text).then(() => {
        const original = btnElement.innerText;
        btnElement.innerText = "COPIED ✓";
        btnElement.style.background = "#22c55e";
        btnElement.style.color = "#020617";
        setTimeout(() => {
          btnElement.innerText = original;
          btnElement.style.background = "rgba(51, 65, 85, 0.85)";
          btnElement.style.color = "#f8fafc";
        }, 1500);
      });
    };

    window.postGameUpdate = function() {
      const game = document.getElementById("game").value.trim();
      const code = document.getElementById("code").value.trim();
      const link = document.getElementById("link").value.trim();

      if (!game && !code && !link) {
        alert("Enter at least a game name or room code!");
        return;
      }

      gamesRef.push({
        game: game || "Game",
        code: code || "",
        link: link || "",
        timeString: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        createdAt: Date.now()
      });

      document.getElementById("game").value = "";
      document.getElementById("code").value = "";
      document.getElementById("link").value = "";
    };

    window.postCodeSolution = function() {
      const lang = document.getElementById("code-lang").value;
      const title = document.getElementById("code-title").value.trim();
      const body = document.getElementById("code-body").value.trim();

      if (!body) {
        alert("Please paste your code solution before broadcasting!");
        return;
      }

      solutionsRef.push({
        lang: lang,
        title: title || "Code Solution",
        codeBody: body,
        timeString: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        createdAt: Date.now()
      });

      document.getElementById("code-title").value = "";
      document.getElementById("code-body").value = "";
    };

    window.clearFeed = function(type) {
      if (confirm(`Wipe all active ${type} broadcasts?`)) {
        if (type === 'games') gamesRef.remove();
        if (type === 'solutions') solutionsRef.remove();
      }
    };

    setInterval(() => {
      const elements = document.querySelectorAll("[data-created]");
      const now = Date.now();

      elements.forEach(el => {
        const created = parseInt(el.getAttribute("data-created"), 10);
        const remaining = Math.max(0, EXPIRY_TIME_MS - (now - created));

        if (remaining <= 0) {
          el.innerText = "EXPIRING...";
        } else {
          const m = Math.floor(remaining / 60000);
          const s = Math.floor((remaining % 60000) / 1000);
          el.innerText = `TTL: ${m}:${s < 10 ? '0' : ''}${s}`;
        }
      });
    }, 1000);

    gamesRef.on('value', (snapshot) => {
      const feed = document.getElementById("feed");
      feed.innerHTML = "";
      const data = snapshot.val();

      if (!data) {
        feed.innerHTML = "<p style='color:#64748b; font-family: monospace;'>[NO ACTIVE SIGNALS]</p>";
        return;
      }

      const now = Date.now();
      const entries = Object.entries(data).reverse();
      let count = 0;

      entries.forEach(([key, item]) => {
        if (item.createdAt && (now - item.createdAt > EXPIRY_TIME_MS)) {
          db.ref(`lab-games/${key}`).remove();
          return;
        }

        count++;
        const card = document.createElement("div");
        card.className = "feed-item";

        const topRow = document.createElement("div");
        topRow.className = "card-top";
        topRow.innerHTML = `
          <span class="game-name">${item.game}</span>
          <span class="countdown-tag" data-created="${item.createdAt}">CALCULATING...</span>
        `;
        card.appendChild(topRow);

        if (item.code) {
          const row = document.createElement("div");
          row.className = "row-group";
          const span = document.createElement("span");
          span.className = "code-box";
